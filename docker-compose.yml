name: java-banking-data-platform

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-java-banking-data-platform-airflow:3.3.2-java21}
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment: &airflow-common-environment
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: ${BATCH_BUSINESS_TIMEZONE:-Asia/Ho_Chi_Minh}
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USERNAME:-airflow}:admin
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-change-me-airflow-db-local-only}@airflow-postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-me-airflow-jwt-secret-local-only-32-bytes}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:-change-me-airflow-api-secret-local-only}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    WAREHOUSE_DB_URL: jdbc:postgresql://warehouse-postgres:5432/${POSTGRES_WAREHOUSE_DB:-banking_warehouse}
    WAREHOUSE_DB_USERNAME: ${WAREHOUSE_DB_USERNAME:-banking_warehouse}
    WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-change-me-warehouse-local-only}
    BATCH_DB_MAX_POOL_SIZE: ${BATCH_DB_MAX_POOL_SIZE:-4}
    BATCH_BUSINESS_TIMEZONE: ${BATCH_BUSINESS_TIMEZONE:-Asia/Ho_Chi_Minh}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-banking-lake-writer}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-writer-local-only}
    MINIO_BUCKET: ${MINIO_BUCKET:-banking-lake}
  volumes:
    - ./orchestration/airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  networks: [banking]

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_OLTP_DB:-banking_oltp}
      POSTGRES_USER: ${POSTGRES_USER:-banking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-oltp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [banking]

  warehouse-postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_WAREHOUSE_DB:-banking_warehouse}
      POSTGRES_USER: ${WAREHOUSE_DB_USERNAME:-banking_warehouse}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-change-me-warehouse-local-only}
    ports:
      - "127.0.0.1:${WAREHOUSE_POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres-warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [banking]

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-5L6g3nShT-eMCtK--X86sw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [banking]

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/opt/banking/create-topics.sh"]
    command: ["kafka:9092", "/opt/banking/topics.tsv"]
    volumes:
      - ./scripts/create-topics.sh:/opt/banking/create-topics.sh:ro
      - ./infrastructure/kafka/topics.tsv:/opt/banking/topics.tsv:ro
    restart: "no"
    networks: [banking]

  minio:
    build:
      context: .
      dockerfile: infrastructure/minio/Dockerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
        MC_VERSION: RELEASE.2025-08-13T08-35-41Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-root-local-only}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set health http://localhost:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} >/dev/null 2>&1 && mc ready health >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [banking]

  minio-init:
    build:
      context: .
      dockerfile: infrastructure/minio/Dockerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
        MC_VERSION: RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "/opt/banking/bootstrap.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-root-local-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-banking-lake}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-banking-lake-writer}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-writer-local-only}
      MINIO_BRONZE_RETENTION_DAYS: ${MINIO_BRONZE_RETENTION_DAYS:-30}
      MINIO_SILVER_RETENTION_DAYS: ${MINIO_SILVER_RETENTION_DAYS:-90}
      MINIO_GOLD_RETENTION_DAYS: ${MINIO_GOLD_RETENTION_DAYS:-365}
    volumes:
      - ./infrastructure/minio/bootstrap.sh:/opt/banking/bootstrap.sh:ro
      - ./infrastructure/minio/lake-writer-policy.json:/opt/banking/lake-writer-policy.json:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [banking]

  transaction-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/transaction-service
        ARTIFACT: transaction-service-0.1.0-SNAPSHOT.jar
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_OLTP_DB:-banking_oltp}
      DB_USERNAME: ${POSTGRES_USER:-banking}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-3000}
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8081
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:${TRANSACTION_HOST_PORT:-18080}:8080"
      - "127.0.0.1:${TRANSACTION_MANAGEMENT_HOST_PORT:-18081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [banking]

  outbox-publisher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/outbox-publisher
        ARTIFACT: outbox-publisher-0.1.0-SNAPSHOT.jar
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_OLTP_DB:-banking_oltp}
      DB_USERNAME: ${POSTGRES_USER:-banking}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-3000}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_PUBLISHER_ENABLED: "true"
      OUTBOX_TOPIC: banking.transactions.raw
      PUBLISHER_SERVER_PORT: 8082
      PUBLISHER_MANAGEMENT_PORT: 8083
      PUBLISHER_MANAGEMENT_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:${PUBLISHER_HOST_PORT:-18082}:8082"
      - "127.0.0.1:${PUBLISHER_MANAGEMENT_HOST_PORT:-18083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      transaction-service:
        condition: service_started
    restart: unless-stopped
    networks: [banking]

  transaction-generator:
    profiles: [loadtest]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/transaction-generator
        ARTIFACT: transaction-generator-0.1.0-SNAPSHOT.jar
    environment:
      GENERATOR_ENABLED: "true"
      TRANSACTION_API_BASE_URL: http://transaction-service:8080
      GENERATOR_TPS: ${GENERATOR_TPS:-10}
      GENERATOR_DURATION: ${GENERATOR_DURATION:-60s}
      GENERATOR_SEED: ${GENERATOR_SEED:-1607}
      GENERATOR_ACCOUNT_IDS: ${GENERATOR_ACCOUNT_IDS:-ACC10001}
      GENERATOR_CURRENCY: ${GENERATOR_CURRENCY:-VND}
      GENERATOR_MAX_IN_FLIGHT: ${GENERATOR_MAX_IN_FLIGHT:-100}
    depends_on:
      transaction-service:
        condition: service_started
    restart: "no"
    networks: [banking]

  flink-jobmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
        parallelism.default: ${STREAMING_PARALLELISM:-1}
    ports:
      - "127.0.0.1:${FLINK_DASHBOARD_HOST_PORT:-18084}:8081"
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/overview >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks: [banking]

  flink-taskmanager:
    build:
      context: .
      dockerfile: Dockerfile.flink
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS:-2}
        parallelism.default: ${STREAMING_PARALLELISM:-1}
    volumes:
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    restart: unless-stopped
    networks: [banking]

  flink-submit:
    build:
      context: .
      dockerfile: Dockerfile.flink
    entrypoint: ["/bin/bash", "/opt/banking/submit-flink-job.sh"]
    environment:
      FLINK_JOBMANAGER: flink-jobmanager:8081
      FLINK_JOB_NAME: banking-phase5-streaming
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STREAMING_GROUP_ID: ${STREAMING_GROUP_ID:-banking-streaming-v1}
      STREAMING_STARTING_OFFSETS: ${STREAMING_STARTING_OFFSETS:-COMMITTED_OR_EARLIEST}
      CHECKPOINT_INTERVAL: ${CHECKPOINT_INTERVAL:-PT5S}
      CHECKPOINT_DIRECTORY: file:///opt/flink/checkpoints
      WATERMARK_OUT_OF_ORDERNESS: ${WATERMARK_OUT_OF_ORDERNESS:-PT15S}
      WATERMARK_IDLENESS: ${WATERMARK_IDLENESS:-PT5S}
      ALLOWED_LATENESS: ${ALLOWED_LATENESS:-PT30S}
      DEDUPLICATION_TTL: ${DEDUPLICATION_TTL:-PT24H}
      HIGH_VALUE_THRESHOLD: ${HIGH_VALUE_THRESHOLD:-100000000.00}
      VELOCITY_THRESHOLD: ${VELOCITY_THRESHOLD:-10}
      STREAMING_PARALLELISM: ${STREAMING_PARALLELISM:-1}
    volumes:
      - ./scripts/submit-flink-job.sh:/opt/banking/submit-flink-job.sh:ro
      - flink-checkpoints:/opt/flink/checkpoints
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_healthy
      flink-taskmanager:
        condition: service_started
    restart: "no"
    networks: [banking]

  lake-writer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/lake-writer
        ARTIFACT: lake-writer-0.1.0-SNAPSHOT.jar
    environment:
      LAKE_WRITER_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-banking-lake}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-banking-lake-writer}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-writer-local-only}
      LAKE_RAW_GROUP_ID: ${LAKE_RAW_GROUP_ID:-banking-lake-bronze-v1}
      LAKE_CURATED_GROUP_ID: ${LAKE_CURATED_GROUP_ID:-banking-lake-curated-v1}
      LAKE_STARTING_OFFSETS: ${LAKE_STARTING_OFFSETS:-earliest}
      LAKE_MAX_BATCH_RECORDS: ${LAKE_MAX_BATCH_RECORDS:-500}
      LAKE_FLUSH_INTERVAL: ${LAKE_FLUSH_INTERVAL:-5s}
      LAKE_POLL_TIMEOUT: ${LAKE_POLL_TIMEOUT:-500ms}
      LAKE_RETRY_BACKOFF: ${LAKE_RETRY_BACKOFF:-2s}
      LAKE_SERVER_PORT: 8086
      LAKE_MANAGEMENT_PORT: 8087
      LAKE_MANAGEMENT_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:${LAKE_HOST_PORT:-18086}:8086"
      - "127.0.0.1:${LAKE_MANAGEMENT_HOST_PORT:-18087}:8087"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [banking]

  warehouse-writer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/warehouse-writer
        ARTIFACT: warehouse-writer-0.1.0-SNAPSHOT.jar
    environment:
      WAREHOUSE_WRITER_ENABLED: "true"
      WAREHOUSE_DB_URL: jdbc:postgresql://warehouse-postgres:5432/${POSTGRES_WAREHOUSE_DB:-banking_warehouse}
      WAREHOUSE_DB_USERNAME: ${WAREHOUSE_DB_USERNAME:-banking_warehouse}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-change-me-warehouse-local-only}
      WAREHOUSE_DB_MAX_POOL_SIZE: ${WAREHOUSE_DB_MAX_POOL_SIZE:-10}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WAREHOUSE_VALIDATED_GROUP_ID: ${WAREHOUSE_VALIDATED_GROUP_ID:-banking-warehouse-validated-v1}
      WAREHOUSE_FRAUD_GROUP_ID: ${WAREHOUSE_FRAUD_GROUP_ID:-banking-warehouse-fraud-v1}
      WAREHOUSE_AGGREGATES_GROUP_ID: ${WAREHOUSE_AGGREGATES_GROUP_ID:-banking-warehouse-aggregates-v1}
      WAREHOUSE_STARTING_OFFSETS: ${WAREHOUSE_STARTING_OFFSETS:-earliest}
      WAREHOUSE_MAX_POLL_RECORDS: ${WAREHOUSE_MAX_POLL_RECORDS:-500}
      WAREHOUSE_POLL_TIMEOUT: ${WAREHOUSE_POLL_TIMEOUT:-500ms}
      WAREHOUSE_RETRY_BACKOFF: ${WAREHOUSE_RETRY_BACKOFF:-2s}
      WAREHOUSE_DLQ_PUBLISH_INTERVAL: ${WAREHOUSE_DLQ_PUBLISH_INTERVAL:-1s}
      WAREHOUSE_SERVER_PORT: 8088
      WAREHOUSE_MANAGEMENT_PORT: 8089
      WAREHOUSE_MANAGEMENT_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:${WAREHOUSE_HOST_PORT:-18088}:8088"
      - "127.0.0.1:${WAREHOUSE_MANAGEMENT_HOST_PORT:-18089}:8089"
    depends_on:
      warehouse-postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [banking]

  batch-processor:
    profiles: [batch]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/batch-processor
        ARTIFACT: batch-processor-0.1.0-SNAPSHOT.jar
    environment:
      WAREHOUSE_DB_URL: jdbc:postgresql://warehouse-postgres:5432/${POSTGRES_WAREHOUSE_DB:-banking_warehouse}
      WAREHOUSE_DB_USERNAME: ${WAREHOUSE_DB_USERNAME:-banking_warehouse}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-change-me-warehouse-local-only}
      BATCH_DB_MAX_POOL_SIZE: ${BATCH_DB_MAX_POOL_SIZE:-4}
      BATCH_BUSINESS_TIMEZONE: ${BATCH_BUSINESS_TIMEZONE:-Asia/Ho_Chi_Minh}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-banking-lake-writer}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-writer-local-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-banking-lake}
    depends_on:
      warehouse-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [banking]

  warehouse-migrate:
    profiles: [analytics]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/warehouse-writer
        ARTIFACT: warehouse-writer-0.1.0-SNAPSHOT.jar
    command: ["--spring.main.web-application-type=none"]
    environment:
      WAREHOUSE_WRITER_ENABLED: "false"
      WAREHOUSE_DB_URL: jdbc:postgresql://warehouse-postgres:5432/${POSTGRES_WAREHOUSE_DB:-banking_warehouse}
      WAREHOUSE_DB_USERNAME: ${WAREHOUSE_DB_USERNAME:-banking_warehouse}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-change-me-warehouse-local-only}
      WAREHOUSE_DB_MAX_POOL_SIZE: 2
    depends_on:
      warehouse-postgres:
        condition: service_healthy
    restart: "no"
    networks: [banking]

  analytics-service:
    profiles: [analytics]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/analytics-service
        ARTIFACT: analytics-service-0.1.0-SNAPSHOT.jar
    environment:
      WAREHOUSE_DB_URL: jdbc:postgresql://warehouse-postgres:5432/${POSTGRES_WAREHOUSE_DB:-banking_warehouse}
      WAREHOUSE_DB_USERNAME: ${WAREHOUSE_DB_USERNAME:-banking_warehouse}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:-change-me-warehouse-local-only}
      ANALYTICS_DB_MAX_POOL_SIZE: ${ANALYTICS_DB_MAX_POOL_SIZE:-10}
      ANALYTICS_DB_MIN_IDLE: ${ANALYTICS_DB_MIN_IDLE:-2}
      ANALYTICS_DB_CONNECTION_TIMEOUT_MS: ${ANALYTICS_DB_CONNECTION_TIMEOUT_MS:-3000}
      ANALYTICS_DB_VALIDATION_TIMEOUT_MS: ${ANALYTICS_DB_VALIDATION_TIMEOUT_MS:-2000}
      ANALYTICS_QUERY_TIMEOUT: ${ANALYTICS_QUERY_TIMEOUT:-3s}
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8081
      MANAGEMENT_SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:${ANALYTICS_HOST_PORT:-18092}:8080"
      - "127.0.0.1:${ANALYTICS_MANAGEMENT_HOST_PORT:-18093}:8081"
    depends_on:
      warehouse-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [banking]

  airflow-postgres:
    profiles: [airflow]
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-change-me-airflow-db-local-only}
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [banking]

  airflow-init:
    <<: *airflow-common
    profiles: [airflow]
    command: ["db", "migrate"]
    depends_on:
      airflow-postgres:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    profiles: [airflow]
    command: ["api-server"]
    ports:
      - "127.0.0.1:${AIRFLOW_HOST_PORT:-18090}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    profiles: [airflow]
    command: ["scheduler"]
    depends_on:
      airflow-api-server:
        condition: service_healthy
      warehouse-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    profiles: [airflow]
    command: ["dag-processor"]
    depends_on:
      airflow-api-server:
        condition: service_healthy
    restart: unless-stopped

  airflow-cli:
    <<: *airflow-common
    profiles: [airflow]
    command: ["version"]
    depends_on:
