global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

  - job_name: transaction-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [transaction-service:8081]

  - job_name: outbox-publisher
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [outbox-publisher:8083]

  - job_name: lake-writer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [lake-writer:8087]

  - job_name: warehouse-writer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [warehouse-writer:8089]

  - job_name: analytics-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [analytics-service:8081]

  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]

  - job_name: postgres-oltp
    static_configs:
      - targets: [postgres-exporter-oltp:9187]

  - job_name: postgres-warehouse
    static_configs:
      - targets: [postgres-exporter-warehouse:9187]

  - job_name: flink-jobmanager
    static_configs:
      - targets: [flink-jobmanager:9249]

  - job_name: flink-taskmanager
    static_configs:
      - targets: [flink-taskmanager:9249]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: [minio:9000]
