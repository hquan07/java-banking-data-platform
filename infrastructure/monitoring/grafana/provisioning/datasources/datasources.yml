apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Warehouse
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 5s

  - name: Warehouse
    uid: warehouse
    type: postgres
    access: proxy
    url: warehouse-postgres:5432
    user: $WAREHOUSE_DB_USERNAME
    editable: false
    secureJsonData:
      password: $WAREHOUSE_DB_PASSWORD
    jsonData:
      database: $POSTGRES_WAREHOUSE_DB
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
