spring:
  application:
    name: batch-processor
  main:
    web-application-type: none
    banner-mode: off
  datasource:
    url: ${WAREHOUSE_DB_URL:jdbc:postgresql://localhost:55433/banking_warehouse}
    username: ${WAREHOUSE_DB_USERNAME:banking_warehouse}
    password: ${WAREHOUSE_DB_PASSWORD:change-me-warehouse-local-only}
    hikari:
      maximum-pool-size: ${BATCH_DB_MAX_POOL_SIZE:4}
      connection-timeout: ${BATCH_DB_CONNECTION_TIMEOUT_MS:5000}
  flyway:
    enabled: true
    locations: classpath:db/migration

batch:
  job-name: daily-transactions
  business-timezone: ${BATCH_BUSINESS_TIMEZONE:Asia/Ho_Chi_Minh}
  minio-endpoint: ${MINIO_ENDPOINT:http://localhost:19000}
  minio-access-key: ${MINIO_ACCESS_KEY:banking-lake-writer}
  minio-secret-key: ${MINIO_SECRET_KEY:change-me-writer-local-only}
  minio-bucket: ${MINIO_BUCKET:banking-lake}
