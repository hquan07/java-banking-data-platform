spring:
  application:
    name: analytics-service
  datasource:
    url: ${WAREHOUSE_DB_URL:jdbc:postgresql://localhost:5433/banking_warehouse}
    username: ${WAREHOUSE_DB_USERNAME:banking_warehouse}
    password: ${WAREHOUSE_DB_PASSWORD:change-me-warehouse-local-only}
    hikari:
      read-only: true
      maximum-pool-size: ${ANALYTICS_DB_MAX_POOL_SIZE:10}
      minimum-idle: ${ANALYTICS_DB_MIN_IDLE:2}
      connection-timeout: ${ANALYTICS_DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${ANALYTICS_DB_VALIDATION_TIMEOUT_MS:2000}
  flyway:
    enabled: false
  jdbc:
    template:
      query-timeout: ${ANALYTICS_QUERY_TIMEOUT:3s}
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    connection-timeout: ${ANALYTICS_HTTP_CONNECTION_TIMEOUT:5s}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s

logging:
  level:
    io.github.hquan07.banking.analytics: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [correlation_id:%X{correlation_id:-}] [%thread] %logger{36} : %msg %kvp%n%wEx"
